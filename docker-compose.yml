version: '3.8'

services:
  conveyor-twin:
    build:
      context: .
      dockerfile: Dockerfile
    image: conveyor-digital-twin:latest
    container_name: conveyor-digital-twin
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
